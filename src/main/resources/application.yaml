spring:
  application:
    name: stripe

  datasource:
    url: jdbc:mysql://localhost:3306/javabuilder_stripe
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
